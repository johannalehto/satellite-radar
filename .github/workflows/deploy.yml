name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy satellite-radar
        run: flyctl deploy --remote-only -a satellite-radar -c fly.api.toml

      - name: Recreate scheduled updater machine (daily run)
        run: |
          set -e

          for id in $(flyctl machines list -a satellite-catalog-updater --json | python3 -c "import sys, json; print(' '.join(m['id'] for m in json.load(sys.stdin)))"); do
            echo "Destroying machine $id"
            flyctl machine destroy "$id" -a satellite-catalog-updater --yes
          done

          flyctl machine run . -a satellite-catalog-updater \
            --schedule daily \
            --restart no \
            --region arn \
            --vm-size shared-cpu-1x \
            --memory 256 \
            -- \
            python -m app.satellite_catalog.updater
