services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satellite_catalog_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"  # map container's port 8000 to host's port 8000
    environment:
      MONGO_URI: mongodb://satellites-local:satellites-local-password@mongo:27017/satellites_db?authSource=admin
      MONGO_DBNAME: satellites_db
    depends_on:
      - mongo


  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"  # map container's port 27017 to host's port 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: satellites-local
      MONGO_INITDB_ROOT_PASSWORD: satellites-local-password
    volumes:
      - mongo_data:/data/db


volumes:
  mongo_data:
